<script>
"use strict";
const DATA = JSON.parse(document.getElementById("codemap-data").textContent);
const LAYOUT = JSON.parse(document.getElementById("codemap-layout").textContent);

const ROLE_STYLE = {
  "entrypoint": {color:"var(--entry)", label:"точка запуска"},
  "ui":         {color:"var(--ui)",    label:"интерфейс (Streamlit)"},
  "core":       {color:"var(--core)", label:"движок загрузки"},
  "io":         {color:"var(--io)",   label:"обёртка ClickHouse"},
  "config":     {color:"var(--config)",label:"конфигурация"},
  "tests":      {color:"var(--test)", label:"тесты"},
  "docs":       {color:"var(--doc)",  label:"документация"},
  "benchmark":  {color:"var(--test)", label:"бенчмарки"},
  "external-lib":{color:"var(--ext)", label:"внешняя библиотека"},
  "database":   {color:"var(--db)",   label:"ClickHouse-сервер"},
  "datasource": {color:"var(--data)", label:"исходные данные (CSV)"},
};
const EDGE_LABEL = {imports:"импорт", calls:"вызовы", reads:"чтение данных", writes:"запись в ClickHouse", publishes:"публикация состояния", subscribes:"подписка"};

const nodesById = {};
DATA.nodes.forEach(n => nodesById[n.id] = n);

/* ---------- build SVG ---------- */
const svg = document.getElementById("svg");
const vp = document.getElementById("viewport");
const NW = 168, NH = 52;

function nodeCenter(id){
  const p = LAYOUT.positions[id];
  return {x:p.x + NW/2, y:p.y + NH/2};
}
function edgePath(e){
  const a = nodeCenter(e.from), b = nodeCenter(e.to);
  const dx = b.x - a.x, dy = b.y - a.y;
  let sx, sy, tx, ty;
  if (Math.abs(dx) > Math.abs(dy)) {
    sx = a.x + Math.sign(dx)*NW/2; sy = a.y;
    tx = b.x - Math.sign(dx)*NW/2; ty = b.y;
  } else {
    sx = a.x; sy = a.y + Math.sign(dy)*NH/2;
    tx = b.x; ty = b.y - Math.sign(dy)*NH/2;
  }
  const mx = (sx+tx)/2, my = (sy+ty)/2;
  const bend = (e.bend || 0);
  const nxv = -(ty-sy), nyv = (tx-sx);
  const nl = Math.hypot(nxv, nyv) || 1;
  const cx = mx + nxv/nl*bend, cy = my + nyv/nl*bend;
  return `M${sx},${sy} Q${cx},${cy} ${tx},${ty}`;
}

const edgeEls = [];
function drawBoundaries(){
  (LAYOUT.boundaries||[]).forEach(b=>{
    const r = document.createElementNS(svg.namespaceURI,"rect");
    r.setAttribute("class","boundary");
    r.setAttribute("x",b.x); r.setAttribute("y",b.y);
    r.setAttribute("width",b.w); r.setAttribute("height",b.h);
    r.setAttribute("rx",14);
    vp.appendChild(r);
    const t = document.createElementNS(svg.namespaceURI,"text");
    t.setAttribute("class","boundary-label");
    t.setAttribute("x",b.x+12); t.setAttribute("y",b.y+18);
    t.textContent = b.label;
    vp.appendChild(t);
  });
}
function drawEdges(){
  DATA.edges.forEach((e,i)=>{
    if(!(e.from in LAYOUT.positions) || !(e.to in LAYOUT.positions)) return;
    const p = document.createElementNS(svg.namespaceURI,"path");
    p.setAttribute("class","edge "+e.type);
    p.setAttribute("d", edgePath(e));
    p.setAttribute("marker-end","url(#arr)");
    p.dataset.idx = i;
    const ttl = document.createElementNS(svg.namespaceURI,"title");
    const ev = (e.evidence && e.evidence !== "unknown") ? ` — ${e.evidence.symbol} (${e.evidence.path}:${e.evidence.line||"?"})` : "";
    ttl.textContent = `${e.from} → ${e.to} · ${EDGE_LABEL[e.type]||e.type}${ev}`;
    p.appendChild(ttl);
    vp.appendChild(p);
    edgeEls.push(p);
  });
}
const nodeEls = {};
function drawNodes(){
  DATA.nodes.forEach(n=>{
    const pos = LAYOUT.positions[n.id];
    if(!pos) return;
    const g = document.createElementNS(svg.namespaceURI,"g");
    g.setAttribute("class","node");
    g.setAttribute("transform",`translate(${pos.x},${pos.y})`);
    g.dataset.id = n.id;
    const st = ROLE_STYLE[n.role] || {color:"var(--ext)"};
    const r = document.createElementNS(svg.namespaceURI,"rect");
    r.setAttribute("width",NW); r.setAttribute("height",NH); r.setAttribute("rx",8);
    r.setAttribute("stroke", st.color);
    g.appendChild(r);
    const t1 = document.createElementNS(svg.namespaceURI,"text");
    t1.setAttribute("x",12); t1.setAttribute("y",22);
    t1.textContent = n.label || n.id;
    g.appendChild(t1);
    const t2 = document.createElementNS(svg.namespaceURI,"text");
    t2.setAttribute("x",12); t2.setAttribute("y",39);
    t2.setAttribute("class","sub");
    t2.textContent = n.path ? n.path : (ROLE_STYLE[n.role]||{}).label || "";
    g.appendChild(t2);
    const badge = document.createElementNS(svg.namespaceURI,"circle");
    badge.setAttribute("cx",NW-1); badge.setAttribute("cy",1); badge.setAttribute("r",11);
    badge.setAttribute("fill","var(--hl-flow)");
    badge.style.display="none";
    badge.classList.add("stepbadge");
    g.appendChild(badge);
    const bt = document.createElementNS(svg.namespaceURI,"text");
    bt.setAttribute("x",NW-1); bt.setAttribute("y",5);
    bt.setAttribute("text-anchor","middle");
    bt.setAttribute("class","stepnum");
    bt.style.display="none";
    g.appendChild(bt);
    vp.appendChild(g);
    nodeEls[n.id] = g;
    g.addEventListener("click", ev=>{ev.stopPropagation(); selectNode(n.id);});
  });
}
drawBoundaries(); drawEdges(); drawNodes();

/* ---------- legend ---------- */
(function(){
  const lg = document.getElementById("legend");
  const seen = new Set(DATA.nodes.map(n=>n.role));
  let html = "";
  Object.entries(ROLE_STYLE).forEach(([k,v])=>{
    if(!seen.has(k)) return;
    html += `<div class="row"><span class="sw" style="background:${v.color}"></span>${v.label}</div>`;
  });
  html += `<div style="height:6px"></div>`;
  html += `<div class="lrow"><span class="lsw" style="border-color:#7d8794"></span>вызов</div>`;
  html += `<div class="lrow"><span class="lsw" style="border-color:#4a5568; border-top-style:dashed"></span>импорт</div>`;
  html += `<div class="lrow"><span class="lsw" style="border-color:var(--db)"></span>запись в ClickHouse</div>`;
  html += `<div class="lrow"><span class="lsw" style="border-color:var(--io)"></span>чтение данных</div>`;
  lg.innerHTML = html;
})();

/* ---------- pan & zoom ---------- */
let view = {x:LAYOUT.view.x, y:LAYOUT.view.y, k:LAYOUT.view.k};
function applyView(){ vp.setAttribute("transform",`translate(${view.x},${view.y}) scale(${view.k})`); }
applyView();
svg.addEventListener("wheel", e=>{
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.12 : 1/1.12;
  const pt = svgPoint(e);
  view.x = pt.x - (pt.x - view.x)*f;
  view.y = pt.y - (pt.y - view.y)*f;
  view.k *= f;
  applyView();
},{passive:false});
function svgPoint(e){
  const r = svg.getBoundingClientRect();
  return {x:e.clientX - r.left, y:e.clientY - r.top};
}
let drag = null;
svg.addEventListener("mousedown", e=>{
  const g = e.target.closest(".node");
  if(g){
    drag = {type:"node", id:g.dataset.id, start:svgPoint(e), orig:{...LAYOUT.positions[g.dataset.id]}};
  } else {
    drag = {type:"pan", start:svgPoint(e), orig:{x:view.x, y:view.y}};
    svg.classList.add("panning");
  }
});
window.addEventListener("mousemove", e=>{
  if(!drag) return;
  const p = svgPoint(e);
  const dx = p.x - drag.start.x, dy = p.y - drag.start.y;
  if(drag.type==="pan"){
    view.x = drag.orig.x + dx; view.y = drag.orig.y + dy; applyView();
  } else {
    const pos = LAYOUT.positions[drag.id];
    pos.x = drag.orig.x + dx/view.k; pos.y = drag.orig.y + dy/view.k;
    nodeEls[drag.id].setAttribute("transform",`translate(${pos.x},${pos.y})`);
    edgeEls.forEach(el=>{
      const e2 = DATA.edges[el.dataset.idx];
      if(e2.from===drag.id || e2.to===drag.id) el.setAttribute("d", edgePath(e2));
    });
  }
});
window.addEventListener("mouseup", ()=>{ if(drag && drag.type==="pan") svg.classList.remove("panning"); drag=null; });
svg.addEventListener("click", e=>{ if(!e.target.closest(".node")) clearAll(); });
window.addEventListener("keydown", e=>{ if(e.key==="Escape") clearAll(); });

/* ---------- selection / highlighting ---------- */
let activeFlow = null, activeNode = null;
function resetClasses(){
  Object.values(nodeEls).forEach(g=>{ g.classList.remove("dim","semi","hl-up","hl-down","hl-sel","hl-test","hl-flow");
    g.querySelector(".stepbadge").style.display="none";
    g.querySelectorAll("text")[2] && (g.querySelectorAll("text")[2].style.display="none");
  });
  edgeEls.forEach(p=>{ p.classList.remove("dim","hl","hl-flowedge"); p.setAttribute("marker-end","url(#arr)"); });
}
function clearAll(){
  activeFlow = null; activeNode = null;
  resetClasses();
  document.querySelectorAll(".flowchip").forEach(c=>c.classList.remove("active"));
  document.getElementById("flowbar").classList.remove("open");
  document.getElementById("panel").classList.remove("open");
  applyFilters();
}
function selectNode(id){
  activeFlow = null;
  document.querySelectorAll(".flowchip").forEach(c=>c.classList.remove("active"));
  document.getElementById("flowbar").classList.remove("open");
  activeNode = id;
  resetClasses();
  const up = new Set(), down = new Set();
  edgeEls.forEach(p=>{
    const e = DATA.edges[p.dataset.idx];
    if(e.to===id && e.from!==id){ up.add(e.from); p.classList.add("hl"); }
    else if(e.from===id && e.to!==id){ down.add(e.to); p.classList.add("hl"); }
    else p.classList.add("dim");
  });
  const n = nodesById[id];
  const testIds = new Set((n.tests||[]).map(t=>t.node).filter(Boolean));
  Object.entries(nodeEls).forEach(([nid,g])=>{
    if(nid===id) g.classList.add("hl-sel");
    else if(up.has(nid)) g.classList.add("hl-up");
    else if(down.has(nid)) g.classList.add("hl-down");
    else if(testIds.has(nid)) g.classList.add("hl-test");
    else g.classList.add("dim");
  });
  showPanel(id, up, down);
}
function showPanel(id, up, down){
  const n = nodesById[id];
  const st = ROLE_STYLE[n.role]||{color:"var(--ext)",label:n.role};
  const panel = document.getElementById("panel");
  let h = `<button class="closebtn" onclick="clearAll()">×</button>`;
  h += `<h2><span class="dot" style="background:${st.color}"></span>${esc(n.label||n.id)}</h2>`;
  h += `<div class="path">${esc(n.path||st.label)}</div>`;
  h += `<div class="sub">${esc(n.summary||"")}</div>`;
  if(up.size){
    h += `<h3>Кто вызывает (${up.size})</h3><ul>`;
    [...up].forEach(u=>{
      const evs = DATA.edges.filter(e=>e.from===u&&e.to===id).map(fmtEdgeEv).join("; ");
      h += `<li class="rel" onclick="selectNode('${u}')"><code>${esc(u)}</code> <span class="ev">${evs}</span></li>`;
    });
    h += `</ul>`;
  }
  if(down.size){
    h += `<h3>От чего зависит (${down.size})</h3><ul>`;
    [...down].forEach(d=>{
      const evs = DATA.edges.filter(e=>e.from===id&&e.to===d).map(fmtEdgeEv).join("; ");
      h += `<li class="rel" onclick="selectNode('${d}')"><code>${esc(d)}</code> <span class="ev">${evs}</span></li>`;
    });
    h += `</ul>`;
  }
  if((n.entrypoints||[]).length){
    h += `<h3>Точки входа</h3><ul>`;
    n.entrypoints.forEach(ep=>{
      h += `<li><code>${esc(ep.symbol)}</code>${ep.line?` <span class="ev">:${ep.line}</span>`:""}${ep.summary?`<div class="sub">${esc(ep.summary)}</div>`:""}</li>`;
    });
    h += `</ul>`;
  }
  if((n.constraints||[]).length){
    h += `<h3>Ограничения и инварианты</h3><ul>`;
    n.constraints.forEach(c=>{
      h += `<li>${esc(c.text)}<div class="ev">${esc(c.evidence&&c.evidence.symbol||"")} ${c.evidence&&c.evidence.path?esc(c.evidence.path)+":"+(c.evidence.line||"?"):""}</div></li>`;
    });
    h += `</ul>`;
  }
  if((n.tests||[]).length){
    h += `<h3>Тесты (${n.tests.length})</h3><ul>`;
    n.tests.forEach(t=>{
      h += `<li><code>${esc(t.path)}</code>${t.verifies?`<div class="sub">${esc(t.verifies)}</div>`:""}</li>`;
    });
    h += `</ul>`;
  }
  const flows = DATA.flows.filter(f=>f.steps.some(s=>s.node===id));
  if(flows.length){
    h += `<h3>Участвует в потоках</h3><ul>`;
    flows.forEach(f=>{
      h += `<li class="flowref" onclick="selectFlow('${f.id}')">▶ ${esc(f.title||f.id)}</li>`;
    });
    h += `</ul>`;
  }
  panel.innerHTML = h;
  panel.classList.add("open");
}
function fmtEdgeEv(e){
  const lbl = EDGE_LABEL[e.type]||e.type;
  if(e.evidence && e.evidence!=="unknown") return `${lbl}: ${e.evidence.symbol}`;
  return lbl+" (unknown)";
}

/* ---------- flows ---------- */
function selectFlow(fid){
  const f = DATA.flows.find(x=>x.id===fid);
  if(!f) return;
  activeNode = null; activeFlow = fid;
  document.getElementById("panel").classList.remove("open");
  resetClasses();
  document.querySelectorAll(".flowchip").forEach(c=>c.classList.toggle("active", c.dataset.id===fid));
  const stepNodes = f.steps.map(s=>s.node);
  const inFlow = new Set(stepNodes);
  Object.entries(nodeEls).forEach(([nid,g])=>{
    if(inFlow.has(nid)){
      g.classList.add("hl-flow");
      const idx = stepNodes.indexOf(nid);
      const badge = g.querySelector(".stepbadge");
      const texts = g.querySelectorAll("text");
      const bt = texts[texts.length-1];
      badge.style.display=""; bt.style.display="";
      bt.textContent = String(idx+1);
    } else g.classList.add("dim");
  });
  const consec = new Set();
  for(let i=0;i<stepNodes.length-1;i++) consec.add(stepNodes[i]+"→"+stepNodes[i+1]);
  edgeEls.forEach(p=>{
    const e = DATA.edges[p.dataset.idx];
    if(consec.has(e.from+"→"+e.to)){ p.classList.add("hl-flowedge"); p.setAttribute("marker-end","url(#arr-hl)"); }
    else if(inFlow.has(e.from)&&inFlow.has(e.to)) p.classList.add("semi");
    else p.classList.add("dim");
  });
  const fb = document.getElementById("flowbar");
  fb.innerHTML = `<b>${esc(f.title||f.id)}</b> · триггер: ${esc(f.trigger)} · итог: ${esc(f.outcome)}
    <div class="steps">${f.steps.map((s,i)=>`<b>${i+1}.</b> ${esc(s.node)} — ${esc(s.action)}`).join(" &nbsp;·&nbsp; ")}</div>`;
  fb.classList.add("open");
}
(function(){
  const wrap = document.getElementById("flowchips");
  DATA.flows.forEach(f=>{
    const b = document.createElement("button");
    b.className = "flowchip"; b.dataset.id = f.id;
    b.textContent = f.title||f.id;
    b.addEventListener("click", ()=>{ activeFlow===f.id ? clearAll() : selectFlow(f.id); });
    wrap.appendChild(b);
  });
})();

/* ---------- search & filters ---------- */
const roleFilterState = {};
(function(){
  const groups = [["entrypoint","запуск"],["ui","UI"],["core","движок"],["io","IO"],["config","конфиг"],["tests","тесты"],["benchmark","бенч"],["docs","доки"],["external-lib","внешние"],["database","БД"],["datasource","CSV"]];
  const present = new Set(DATA.nodes.map(n=>n.role));
  const wrap = document.getElementById("filters");
  wrap.insertAdjacentHTML("beforeend", `<span style="color:var(--faint); margin-left:6px">Фильтр:</span>`);
  groups.forEach(([k,label])=>{
    if(!present.has(k)) return;
    roleFilterState[k]=true;
    const l = document.createElement("label");
    l.innerHTML = `<input type="checkbox" checked data-role="${k}"> ${label}`;
    l.querySelector("input").addEventListener("change", e=>{
      roleFilterState[k]=e.target.checked; applyFilters();
    });
    wrap.appendChild(l);
  });
})();
function applyFilters(){
  if(activeNode||activeFlow) return;
  const q = document.getElementById("search").value.trim().toLowerCase();
  DATA.nodes.forEach(n=>{
    const g = nodeEls[n.id]; if(!g) return;
    const roleOK = roleFilterState[n.role]!==false;
    let searchOK = true;
    if(q){
      const hay = [n.id, n.label, n.path, n.summary, ...(n.entrypoints||[]).map(e=>e.symbol)].join(" ").toLowerCase();
      searchOK = hay.includes(q);
    }
    g.classList.toggle("dim", !(roleOK&&searchOK));
    g.classList.toggle("hl-sel", !!q && roleOK && searchOK);
  });
  edgeEls.forEach(p=>{
    const e = DATA.edges[p.dataset.idx];
    const okF = !nodeEls[e.from].classList.contains("dim");
    const okT = !nodeEls[e.to].classList.contains("dim");
    p.classList.toggle("dim", !(okF&&okT));
  });
}
document.getElementById("search").addEventListener("input", ()=>{ if(activeNode||activeFlow){activeNode=null;activeFlow=null;resetClasses();document.getElementById("panel").classList.remove("open");document.getElementById("flowbar").classList.remove("open");document.querySelectorAll(".flowchip").forEach(c=>c.classList.remove("active"));} applyFilters(); });

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
window.selectNode = selectNode; window.selectFlow = selectFlow; window.clearAll = clearAll;
</script>
</body>
